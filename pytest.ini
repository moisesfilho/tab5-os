[pytest]
# Diretórios recursados automaticamente pela suíte pytest.
# Mantém os defaults do pytest e adiciona a política de *build* do repositório
# (gitignore: build/, build-sim/; codespell skip: *build*). Sem isso, um
# BUILD_DIR local deixado em tests/host/ (ex.: build-cov gerado por
# run_host_tests.sh) faz o coletor do pytest descer em artefatos gerados e
# quebrar a coleta com erros de importação.
norecursedirs =
    *.egg
    .*
    _deps
    build*
    dist
    node_modules
    venv
    .venv
    env
    .env
    buck-out
    .pants.d
    .mypy_cache
    .pytest_cache
    .hypothesis
    .tox
    .nox
