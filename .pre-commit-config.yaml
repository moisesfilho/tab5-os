# Hooks de qualidade local (espelham o padrão do espressif/esp-idf).
# Instalar: pip install pre-commit && pre-commit install
#
# Vendido/gerado não é formatado nem alterado pelos hooks:
#   - components/m5stack_tab5   (BSP local vendido, com checksums)
#   - components/rtc_rx8130     (driver RTC de terceiros)
#   - components/os/fonts/      (fontes geradas pelo conversor LVGL)
#   - components/apps/music/minimp3.h (decoder MP3 de cabeçalho único)
#   - components/apps/gallery/tjpgd.c/h (decoder JPEG TJpgDec de terceiros)
#   - managed_components/       (componentes gerenciados)
exclude: >
  (?x)^(
    components/m5stack_tab5/|
    components/rtc_rx8130/|
    components/os/fonts/|
    components/apps/music/minimp3\.h|
    components/apps/gallery/tjpgd\.(c|h)|
    managed_components/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Formatação C/C++ (clang-format; a Espressif usa astyle_py, mas
  # clang-format é o padrão da comunidade e funciona com VS Code/SonarLint)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        # BSP local vendido (components/m5stack_tab5) não é formatado
        exclude: ^components/m5stack_tab5/

  # Lint de arquivos CMake (CMakeLists.txt / .cmake)
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        exclude: ^components/m5stack_tab5/

  # Typos em comentários/strings
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--skip=*build*,*managed_components*,*m5stack_tab5*", "-L", "dout"]
        additional_dependencies:
          - tomli

  # Análise estática e checagens locais (espelham o Quality Gate do CI)
  - repo: local
    hooks:
      - id: clang-tidy-local
        name: clang-tidy (app code)
        entry: tools/ci/run_clang_tidy.sh
        language: script
        types_or: [c, c++]
        files: ^(main/|components/os/|components/apps/).*\.(cpp|c)$
        exclude: ^components/os/fonts/

      - id: cppcheck-local
        name: cppcheck (app code)
        entry: tools/ci/run_cppcheck.sh
        language: script
        types_or: [c, c++]
        files: ^(main/|components/os/|components/apps/).*\.(cpp|c)$
        exclude: ^components/os/fonts/

      - id: idf-build-check
        name: idf build check
        entry: tools/ci/run_idf_build.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
