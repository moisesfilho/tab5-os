name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # semanal: segunda 06:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # autobuild não funciona com ESP-IDF (não é CMake vanilla):
      # o build é feito manualmente com idf.py entre init e analyze.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
          queries: security-and-quality

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          # >=5.5.3 obrigatório (bug do componente usb ^1 com HAL do 5.5+)
          version: v5.5.5

      - name: Build (idf.py manual)
        run: |
          idf.py build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:cpp
