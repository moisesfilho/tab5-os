name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # semanal: segunda 06:00 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # autobuild não funciona com ESP-IDF (não é CMake vanilla):
      # o build é feito manualmente com idf.py entre init e analyze.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          # >=5.5.3 obrigatório (bug do componente usb ^1 com HAL do 5.5+)
          version: v5.5.5

      - name: Build (idf.py manual)
        run: |
          idf.py build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:cpp
          upload: false
          output: ../results

      - name: Filter Third-Party Dependencies from SARIF
        run: |
          python3 -c "
          import json, glob, os

          for sarif_file in set(glob.glob('../results/**/*.sarif', recursive=True) + glob.glob('../results/*.sarif')):
              if not os.path.isfile(sarif_file):
                  continue
              with open(sarif_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              for run in data.get('runs', []):
                  results = run.get('results', [])
                  filtered = []
                  for r in results:
                      is_third_party = False
                      for loc in r.get('locations', []):
                          uri = loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                          if 'managed_components' in uri or uri.startswith('/tmp/esp/') or 'esp-idf' in uri:
                              is_third_party = True
                              break
                      if not is_third_party:
                          filtered.append(r)
                  print(f'SARIF {sarif_file}: filtrados {len(results) - len(filtered)} alertas de dependencias ({len(filtered)} mantidos do projeto)')
                  run['results'] = filtered

              with open(sarif_file, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
          "

      - name: Upload Filtered SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ../results
          category: /language:cpp

      - name: Generate CodeQL Summary
        if: always()
        run: |
          echo "## 🛡️ CodeQL Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Linguagem** | C / C++ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Query Suite** | security-and-quality |" >> $GITHUB_STEP_SUMMARY
          echo "| **Alvo** | ESP32-P4 (ESP-IDF v5.5.5) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Análise concluída com sucesso' || '❌ Falha' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ *Acesse a aba **Security → Code scanning** do repositório para visualizar relatórios e alertas detalhados.*" >> $GITHUB_STEP_SUMMARY
