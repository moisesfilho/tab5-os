name: Quality Gate

on:
  push:
    branches-ignore: []   # qualquer branch
  pull_request:
  workflow_call:          # permite ser chamado por outros workflows (ex: release.yml)

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (ESP-IDF v5.5.5 / esp32p4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          # >=5.5.3 obrigatório (bug do componente usb ^1 com HAL do 5.5+)
          esp_idf_version: v5.5.5
          target: esp32p4
          path: '.'

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🔨 Build Summary (ESP-IDF v5.5.5 / esp32p4)" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ESP32-P4 (RISC-V) |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESP-IDF Version** | v5.5.5 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }} |" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint (clang-tidy + cppcheck)
    runs-on: ubuntu-latest
    # Tag 18 exists in Docker Hub; the manifest digest makes this immutable.
    container: silkeh/clang:18@sha256:3914c93a02e866795aafc80737488e515b96390eff3d2787cf8c5095997baea9
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cppcheck
        run: |
          apt-get update -o Acquire::Retries=3
           apt-get install -y --no-install-recommends cppcheck cmake git python3

      # O host build usa clang e os stubs versionados de tests/host; não
      # mistura flags RISC-V do ESP-IDF com o clang-tidy do container.
      - name: Configure host CMake (compile db)
        run: |
          cmake -S tests/host -B build/host \
             -DCMAKE_BUILD_TYPE=Debug \
             -DHOST_TESTS_COVERAGE=OFF \
             -DCMAKE_C_COMPILER=clang \
             -DCMAKE_CXX_COMPILER=clang++ \
             -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
             -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify pinned clang-tidy
        run: |
          set -euo pipefail
          clang --version
          clang++ --version
          clang-tidy --version
           clang --version | grep -Fq 'clang version 18.'
           clang++ --version | grep -Fq 'clang version 18.'
           clang-tidy --version | grep -Fq 'LLVM version 18.'

      - name: clang-tidy (app code only)
        id: clang_tidy
        run: |
          set -o pipefail
          mapfile -t HOST_SOURCES < <(python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          for entry in json.loads(Path('build/host/compile_commands.json').read_text()):
              path = Path(entry['file'])
              try:
                  relative = path.resolve().relative_to(root.resolve())
              except ValueError:
                  continue
              if str(relative).startswith(('components/os/', 'main/')):
                  print(relative)
          PY
          )
          ./tools/ci/run_clang_tidy.sh "${HOST_SOURCES[@]}" 2>&1 | tee clang-tidy.log

      - name: cppcheck (via compile db)
        id: cppcheck
        run: |
          cppcheck -j $(nproc) \
             --project=build/host/compile_commands.json \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=syntaxError \
            --suppress=incorrectStringBooleanError \
            --suppress=dangerousTypeCast \
            --suppress=*:*minimp3.h* \
            --file-filter=main/* \
            --file-filter=components/os/* \
            --error-exitcode=1 \
            --inline-suppr

      - name: Generate Lint Summary
        if: always()
        run: |
          echo "## 🔍 Lint & Static Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Ferramenta | Escopo | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **clang-tidy** | \`main/\`, \`components/os/\` | ${{ steps.clang_tidy.outcome == 'success' && '✅ Passou' || (steps.clang_tidy.outcome == 'skipped' && '⏭️ Ignorado' || '❌ Problemas detectados') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **cppcheck** | \`main/\`, \`components/os/\` | ${{ steps.cppcheck.outcome == 'success' && '✅ Passou' || (steps.cppcheck.outcome == 'skipped' && '⏭️ Ignorado' || '❌ Problemas detectados') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ *Logs de execução disponíveis no artefato \`lint-logs\`.*" >> $GITHUB_STEP_SUMMARY

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-logs
          path: |
            clang-tidy.log

  test:
    name: Unit Tests (host, cobertura >= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test tools
        run: |
          sudo apt-get update -o Acquire::http::Timeout=15 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends g++ cmake lcov

      - name: Run host unit tests with coverage gate
        run: ./tools/ci/run_host_tests.sh

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Host Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | GoogleTest (host nativo) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gate de cobertura** | linhas >= 80% (gcov/lcov, apenas .cpp de producao) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/host/coverage-html

  python:
    name: Python tests (official tests/ suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python test dependencies
        run: python3 -m pip install --upgrade pytest pillow

      - name: Run official Python suite
        run: |
          set -o pipefail
          timeout --signal=TERM 900s python3 -m pytest -q -ra tests \
            --ignore=managed_components --ignore=tests/fixtures \
            --ignore=tests/external --ignore=tests/device 2>&1 | tee pytest.log

      - name: Report Python suite result
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("pytest.log").read_text(encoding="utf-8") if Path("pytest.log").exists() else ""
          summary = next((line.strip() for line in reversed(text.splitlines())
                          if re.search(r"\b(passed|failed|error|skipped)\b", line)),
                         "pytest did not produce a summary")
          print(f"Pytest result: {summary}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("## 🐍 Official Python suite\n\n")
              report.write(f"`{summary}`\n\n")
              report.write("Device-in-the-loop checks are skipped when the port is "
                           "absent or disconnected during setup; product test failures "
                           "remain failures.\n")
          PY

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-log
          path: pytest.log

  simulator:
    name: Simulator (17 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install simulator dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends cmake g++ libsdl2-dev python3

      - name: Run simulator matrix
        run: timeout --signal=TERM 900s ./tools/ci/run_sim_tests.sh

  pre-commit:
    name: Pre-commit (all files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install lint/build tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends cmake clang clang-tidy cppcheck g++

       # clang-tidy-local consumes this exact database.  Creating it before
       # pre-commit makes a clean checkout deterministic instead of silently
       # linting with guessed/default compiler flags.
      - name: Configure host CMake (compile db for pre-commit)
        run: |
          cmake -S tests/host -B build/host \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHOST_TESTS_COVERAGE=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run all pre-commit hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
