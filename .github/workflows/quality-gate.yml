name: Quality Gate

on:
  push:
    branches-ignore: []   # qualquer branch
  pull_request:
  workflow_call:          # permite ser chamado por outros workflows (ex: release.yml)

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (ESP-IDF v5.5.5 / esp32p4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          # >=5.5.3 obrigatório (bug do componente usb ^1 com HAL do 5.5+)
          esp_idf_version: v5.5.5
          target: esp32p4
          path: '.'

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🔨 Build Summary (ESP-IDF v5.5.5 / esp32p4)" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ESP32-P4 (RISC-V) |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESP-IDF Version** | v5.5.5 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }} |" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint (clang-tidy + cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -o Acquire::http::Timeout=15 -o Acquire::ftp::Timeout=15 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends clang-tidy cppcheck

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      # Gera build/compile_commands.json rapidamente sem compilar binarios
      - name: Configure CMake (compile db)
        run: |
          idf.py reconfigure
          python3 -c "import json, os; [open(x['file'], 'a').close() for x in json.load(open('build/compile_commands.json')) if not os.path.exists(x['file'])]"

      - name: clang-tidy (app code only)
        id: clang_tidy
        run: |
          set +e
          clang-tidy -p build \
            --config-file=.clang-tidy \
            --extra-arg="-Wno-unknown-warning-option" \
            --extra-arg="-Wno-extern-c-compat" \
            --extra-arg="-Wno-unknown-pragmas" \
            --header-filter='components/(os|apps)/(?!.*minimp3).*' \
            main/app_main.cpp \
            components/os/core/*.cpp \
            components/os/shell/*.cpp \
            components/apps/*/*.cpp 2>&1 | tee clang-tidy.log
          # Desconsidera flags especificas do GCC RISC-V
          grep -vE "error: (unknown argument|invalid arch name)" clang-tidy.log > clang-tidy-clean.log
          if grep -qE 'error:|warning:' clang-tidy-clean.log; then
            echo "::error::clang-tidy encontrou problemas — ver clang-tidy.log"
            cat clang-tidy-clean.log
            exit 1
          fi

      - name: cppcheck (via compile db)
        id: cppcheck
        run: |
          cppcheck -j $(nproc) \
            --project=build/compile_commands.json \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=syntaxError \
            --suppress=incorrectStringBooleanError \
            --suppress=dangerousTypeCast \
            --suppress=*:*minimp3.h* \
            --file-filter=main/* \
            --file-filter=components/os/* \
            --file-filter=components/apps/* \
            --error-exitcode=1 \
            --inline-suppr

      - name: Generate Lint Summary
        if: always()
        run: |
          echo "## 🔍 Lint & Static Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Ferramenta | Escopo | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **clang-tidy** | \`main/\`, \`components/os/\`, \`components/apps/\` | ${{ steps.clang_tidy.outcome == 'success' && '✅ Passou' || (steps.clang_tidy.outcome == 'skipped' && '⏭️ Ignorado' || '❌ Problemas detectados') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **cppcheck** | \`main/\`, \`components/os/\`, \`components/apps/\` | ${{ steps.cppcheck.outcome == 'success' && '✅ Passou' || (steps.cppcheck.outcome == 'skipped' && '⏭️ Ignorado' || '❌ Problemas detectados') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ *Logs de execução disponíveis no artefato \`lint-logs\`.*" >> $GITHUB_STEP_SUMMARY

      - name: Upload lint logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs
          path: |
            clang-tidy.log

  test:
    name: Unit Tests (host, cobertura >= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update -o Acquire::http::Timeout=15 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends g++ cmake lcov

      - name: Run host unit tests with coverage gate
        run: ./tools/ci/run_host_tests.sh

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Host Unit Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | GoogleTest (host nativo) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gate de cobertura** | linhas >= 80% (gcov/lcov, apenas .cpp de producao) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/host/coverage-html
