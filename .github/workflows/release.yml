name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # O Quality Gate é reexecutado para garantir que o código da tag está limpo
  quality-gate:
    name: Quality Gate (build + lint)
    uses: ./.github/workflows/quality-gate.yml

  release:
    name: Build & Publish Release Firmware
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build Firmware
        run: |
          idf.py build

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_binaries
          cp build/tab5_os.bin release_binaries/
          cp build/bootloader/bootloader.bin release_binaries/
          cp build/partition_table/partition-table.bin release_binaries/
          cd release_binaries
          zip -r ../tab5_os_firmware.zip ./*
          cd ..

      - name: Generate Release Summary
        if: always()
        run: |
          echo "## 📦 Release Firmware Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Binário / Artefato | Tamanho | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ -f build/tab5_os.bin ]; then
            APP_SZ=$(ls -lh build/tab5_os.bin | awk '{print $5}')
            BOOT_SZ=$(ls -lh build/bootloader/bootloader.bin | awk '{print $5}')
            PART_SZ=$(ls -lh build/partition_table/partition-table.bin | awk '{print $5}')
            ZIP_SZ=$(ls -lh tab5_os_firmware.zip 2>/dev/null | awk '{print $5}' || echo "N/A")
            echo "| \`tab5_os.bin\` | $APP_SZ | Aplicação principal Tab5 OS |" >> $GITHUB_STEP_SUMMARY
            echo "| \`bootloader.bin\` | $BOOT_SZ | Bootloader ESP-IDF (2nd stage) |" >> $GITHUB_STEP_SUMMARY
            echo "| \`partition-table.bin\` | $PART_SZ | Tabela de partições Flash |" >> $GITHUB_STEP_SUMMARY
            echo "| \`tab5_os_firmware.zip\` | $ZIP_SZ | Pacote consolidado para gravação |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Tag de Lançamento:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✨ **Status do Release:** ${{ job.status == 'success' && '✅ Publicado no GitHub Releases' || '❌ Falha' }}" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tab5_os_firmware.zip
            build/tab5_os.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          generate_release_notes: true
          draft: false
          prerelease: false
